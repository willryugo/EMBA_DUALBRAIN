<!doctype html><html><head><meta charset="utf-8"><style>
  html,body{margin:0;padding:0;width:100%;height:100%}
  /* maskable: 마크를 안전영역(중앙 60%)에 두어 OS가 원/둥근사각으로 잘라도 안 잘리게 */
  .icon{width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(135% 135% at 50% 20%, #FFFFFF 0%, #EDF0F8 60%, #E2E7F4 100%);}
  .icon svg{width:62%;height:62%;
    filter:drop-shadow(0 0 2.2% rgba(90,107,245,.55)) drop-shadow(0 0 3.2% rgba(255,79,163,.45));}
</style></head><body>
  <div class="icon">
    <svg viewBox="0 0 100 60" xmlns="http://www.w3.org/2000/svg">
      <g style="mix-blend-mode:multiply">
        <circle cx="32" cy="30" r="25" fill="#5A6BF5"/>
        <circle cx="68" cy="30" r="25" fill="#FF4FA3"/>
      </g>
    </svg>
  </div>
</body></html>
